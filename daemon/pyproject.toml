[project]
name = "emu-memory-daemon"
version = "0.1.0"
description = "Background daemon that curates .emu/ memory files via an LLM agent loop."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

# Runtime deps. Both SDKs are imported lazily (only the one matching
# EMU_DAEMON_PROVIDER is touched), so installs that pin a single provider
# can drop the other.
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
# Use this when the daemon will only ever talk to Anthropic Claude.
claude-only = ["anthropic>=0.39.0"]
# Use this for any OpenAI-compatible provider (openai, openrouter, fireworks,
# together_ai, openai_compatible, baseten, ollama).
openai-only = ["openai>=1.50.0"]

[project.scripts]
emu-memory-daemon = "daemon.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# When extracted to a standalone repo, move daemon/ contents to the package
# root and drop this packages directive. For now we ship daemon/ as the
# package directory under this repo's root.
packages = ["../daemon"]
